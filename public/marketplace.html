<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace - Campus Exchange</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Same navbar as the homepage -->
  <header class="navbar">
    <a href="/" class="logo">Campus Exchange</a>
    <nav>
      <a href="/marketplace.html">Marketplace</a>
      <a href="/login.html">Login</a>
    </nav>
  </header>

  <main class="marketplace-container">
    <div class="marketplace-header">
      <h1>Marketplace</h1>
      <p>Browse resources from students on your campus.</p>
      <input type="text" id="search-input" placeholder="Search for books, calculators..." class="search-input">
            <!-- NEW: Category Filter Buttons -->
      <div class="filter-buttons">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Book">Books</button>
        <button class="filter-btn" data-category="Calculator">Calculators</button>
        <button class="filter-btn" data-category="Lab">Lab</button>
        <button class="filter-btn" data-category="Notes">Notes</button>
      </div>
    </div>

    <!--Grid of Items-->
    <div class="listing-grid" id="listings-container">
      <!-- JavaScript will put the cards here -->
    </div>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
