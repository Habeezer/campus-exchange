<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace - Campus Exchange</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Same navbar as the homepage -->
  <header class="navbar">
    <a href="/" class="logo">Campus Exchange</a>
    <nav>
      <a href="/marketplace.html">Marketplace</a>
      <a href="/login.html">Login</a>
    </nav>
  </header>

  <main class="marketplace-container">
    <div class="marketplace-header">
      <h1>Marketplace</h1>
      <p>Browse resources from students on your campus.</p>
    </div>

    <!-- Hardcoded Grid of Items -->
    <div class="listing-grid">
      
      <!-- Card 1 -->
      <div class="listing-card">
        <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80" alt="Calculus Textbook">
        <div class="card-content">
          <h3>Calculus Early Transcendentals</h3>
          <p class="price">₹450</p>
          <div class="card-tags">
            <span class="tag condition">Good</span>
            <span class="tag category">Book</span>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="listing-card">
        <img src="https://images.unsplash.com/photo-1594980596870-8aa52a78d8cd?w=400&q=80" alt="Scientific Calculator">
        <div class="card-content">
          <h3>Casio FX-991EX Calculator</h3>
          <p class="price">₹800</p>
          <div class="card-tags">
            <span class="tag condition">Like New</span>
            <span class="tag category">Calculator</span>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="listing-card">
        <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=400&q=80" alt="Lab Equipment">
        <div class="card-content">
          <h3>Lab Coat & Goggles Set</h3>
          <p class="price">Free</p>
          <div class="card-tags">
            <span class="tag condition">Fair</span>
            <span class="tag category">Lab</span>
          </div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="listing-card">
        <img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=400&q=80" alt="Study Notes">
        <div class="card-content">
          <h3>CSE 1st Year Handwritten Notes</h3>
          <p class="price">₹150</p>
          <div class="card-tags">
            <span class="tag condition">Good</span>
            <span class="tag category">Notes</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
