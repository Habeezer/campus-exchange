<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campus Exchange</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">Campus Exchange</a>
    <nav>
      <a href="/marketplace.html">Marketplace</a>
    </nav>
  </header>

  <main class="marketplace-container" style="max-width: 400px; margin-top: 4rem;">
    <div class="post-form" style="text-align: center;">
      <h2 id="form-title">Login</h2>
      
      <form id="auth-form" style="text-align: left; margin-top: 1.5rem;">
        <div class="form-group" id="name-group" style="display: none;">
          <label>Name</label>
          <input type="text" id="name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
                <div class="form-group">
          <label>Password</label>
          <div class="password-container">
            <input type="password" id="password" required minlength="8">
            <!-- The Eye Icon -->
            <span id="toggle-password" class="toggle-password">👁️</span>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Login</button>
      </form>

      <p style="margin-top: 1rem; font-size: 0.9rem;">
        <span id="toggle-text">Don't have an account?</span> 
        <a href="#" id="toggle-auth" style="color: #2563eb;">Register</a>
      </p>
    </div>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
